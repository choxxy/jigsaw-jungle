# JPA Stuff
spring.datasource.url=jdbc:postgresql://db:5432/puzzle-photos
spring.datasource.password=admin
#spring.datasource.url=jdbc:postgresql://localhost:2345/puzzle-photos
#spring.datasource.password=r@@tmaster
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.tomcat.connection-properties=useUnicode=true;characterEncoding=utf-8mb4;
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

#App stuff
spring.application.name=Puzzle
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.docker.compose.enabled=false

